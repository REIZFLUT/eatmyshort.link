doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # Optional platform pin, e.g. DB_SERVER_VERSION=mariadb-11.4.0. Only applies when
        # the variable is set; unset (the default) it resolves to null and everything
        # behaves as before - the version is then detected on connect, for SQLite and
        # MariaDB/MySQL alike.
        server_version: '%env(default::DB_SERVER_VERSION)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
            # Mapped superclass Webauthn\CredentialRecord (wird von App\Entity\WebauthnCredential erweitert)
            Webauthn:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/vendor/web-auth/webauthn-symfony-bundle/src/Resources/config/doctrine-mapping'
                prefix: 'Webauthn'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
