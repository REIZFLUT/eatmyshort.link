# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.default_timezone: 'Europe/Berlin'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # The plugin paths come from APP_PLUGIN_DIR / APP_PLUGIN_CONFIG at runtime and cannot be
    # autowired, so the registry is built by a factory from the project directory. Resolving
    # the environment here (not in a container parameter) keeps the compiled container
    # independent of where the plugins live.
    App\Plugin\PluginRegistry:
        factory: ['App\Plugin\PluginRegistry', 'forProject']
        arguments: ['%kernel.project_dir%']

when@test:
    services:
        # _defaults of the block above does not reach this block, so repeat them: the event
        # listeners below rely on autoconfigure to pick up their #[AsEventListener] tags.
        _defaults:
            autowire: true
            autoconfigure: true

        # The http_client mock_response_factory references this id; tests/ is not part of
        # the App\ resource above, so it needs an explicit definition.
        App\Tests\HttpClient\MockResponseFactory: ~

        # Event-contract test doubles. Registered only here (autoconfigure tags them via
        # #[AsEventListener]); every one of them stays inert until a test arms it, so tests
        # that do not arm the corresponding state see the unmodified application behaviour.
        # App\Tests\Support\EventTestState drives the core hooks, the tests/EventListener
        # classes stand in for a plugin.
        App\Tests\Support\RedirectEventTestListener: ~
        App\Tests\Support\ClickEventTestListener: ~
        App\Tests\Support\LinkEventTestListener: ~
        App\Tests\Support\ShortCodeEventTestListener: ~
        App\Tests\EventListener\ApiPluginListener: ~
        App\Tests\EventListener\AdminUiPluginListener: ~
        App\Tests\EventListener\LinkRejectionPluginListener: ~
