# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.default_timezone: 'Europe/Berlin'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # The plugin paths come from APP_PLUGIN_DIR / APP_PLUGIN_CONFIG at runtime and cannot be
    # autowired, so the registry is built by a factory from the project directory. Resolving
    # the environment here (not in a container parameter) keeps the compiled container
    # independent of where the plugins live.
    App\Plugin\PluginRegistry:
        factory: ['App\Plugin\PluginRegistry', 'forProject']
        arguments: ['%kernel.project_dir%']

when@test:
    services:
        # The http_client mock_response_factory references this id; tests/ is not part of
        # the App\ resource above, so it needs an explicit definition.
        App\Tests\HttpClient\MockResponseFactory: ~
