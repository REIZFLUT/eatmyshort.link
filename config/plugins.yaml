# Plugin whitelist.
#
# Only the plugins listed below are loaded. A directory under plugins/ that is not named
# here is ignored completely: its classes are not autoloaded, its services are not
# registered and its routes are not imported. "app:plugin:validate" reports such a
# directory as a warning.
#
# Trust: a plugin is NOT sandboxed. Once enabled it is imported into the container and the
# router exactly like the application's own code and runs with the same rights (database,
# filesystem, network, secrets). Review a plugin before you enable it.
#
# Format:
#   plugins:
#       <name>:
#           enabled: true     # required; <name> must be the plugins/<name>/ directory name,
#                             # [a-z0-9-], 3-40 characters
#           settings: {}      # optional, free-form and plugin-defined; exposed to the plugin
#                             # as the container parameter "app.plugins.<name>.settings"
#
# A "when@<env>:" section has the same shape and is merged over the entries above for that
# environment, so one environment can enable or disable a plugin or override single
# settings without touching the shared list.
#
# The two entries below ship as working examples. Both stay disabled by default - enable
# one to use it.
plugins:
    utm-tagging:
        enabled: false
        # Appends campaign parameters to redirect targets. See plugins/utm-tagging/README.md.
        settings: {}
    click-webhook:
        enabled: false
        # Reports recorded clicks as a signed JSON webhook. See plugins/click-webhook/README.md.
        settings: {}

# Example of enabling one plugin for a single environment. Uncomment the block below to try
# utm-tagging on a development instance; it is merged over the entries above and only
# applies when APP_ENV is "dev".
# when@dev:
#     plugins:
#         utm-tagging:
#             enabled: true
#             settings:
#                 source: newsletter
#                 medium: email
#                 campaign: lokaltest
