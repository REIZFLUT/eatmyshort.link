name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # Ohne .env im Repo braucht die App ihre Konfiguration als echte Umgebungsvariablen.
      APP_ENV: dev
      APP_SECRET: 'ci-only-secret-0123456789abcdef0123456789abcdef'
      APP_ADMIN_HOSTS: admin.emsl.test
      DEFAULT_URI: http://localhost
      DATABASE_URL: 'sqlite:///%kernel.project_dir%/var/data/ci.sqlite'
      MAILER_DSN: null://null
      MAILER_FROM: 'EatMyShort.Link <noreply@localhost>'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sodium, gd
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: php bin/console cache:warmup --env=dev
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
